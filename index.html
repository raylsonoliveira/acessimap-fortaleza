      --primary: #00875F;
      --primary-dark: #006B4B;
      --primary-light: #E6F4EF;
      --accent: #0D9488;
      --chat-blue: #4F46E5;
      --accessible: #10B981;
      --accessible-light: #D1FAE5;
      --partial: #F59E0B;

      --inaccessible: #EF4444;
      --inaccessible-light: #FEE2E2;

    .top-banner {

      text-align: center;
      margin-bottom: 12px;
    }
    .top-banner h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .top-banner p { font-size: 12px; color: #94A3B8; margin-top: 2px; }
    .phone-frame {
      width: 390px;
      height: 780px;
      background: var(--card);
      border-radius: 38px;
      border: 10px solid #334155;
      box-shadow: 0 25px 60px rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    @media (max-width: 600px) {
      body { padding: 0; background: var(--card); }
      .top-banner { display: none; }
      .phone-frame {
        width: 100vw;
        height: 100dvh;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
      .status-bar { display: none !important; }
    }
    .status-bar {
      height: 26px;
      background: #0F172A;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }
    .app-header {
      height: 52px;
      background: #1E293B;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      flex-shrink: 0;
    }
    .ia-badge {
      background: #334155;
      border: 1px solid #475569;
      color: #38BDF8;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;

    .chat-btn {

      border: none;
      padding: 6px 11px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;

    .screen-body {

      display: flex;
      align-items: center;
      justify-content: space-around;

      justify-content: center;

      padding: 6px 0;

      font-weight: 600;
      border: none;

      justify-content: center;
      font-size: 16px;

      font-weight: 700;

    .street-diag { position: absolute; top: 22%; left: -10%; width: 120%; height: 10px; background: #FEF3C7; transform: rotate(24deg); }
    .zone-tag {
      position: absolute;
      font-size: 10px;
      font-weight: 700;
      color: #475569;
      background: rgba(255,255,255,0.75);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .marker {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
      transition: transform 0.15s;
    }
    .marker.selected {
      border-color: #0F172A;
      border-width: 3px;
      transform: scale(1.22);
      z-index: 10;
    }
    .fab {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.28);

    .pills-bar {

      gap: 6px;
      padding: 8px 12px;
      background: var(--card);
      border-bottom: 1px solid var(--border);

    .pill {

      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface-alt);

      justify-content: flex-end;

    .modal-sheet {

    .chip {

      font-size: 12px;
      font-weight: 600;

      background: var(--surface-alt);

    .chip.active { background: var(--primary-light); border-color: var(--primary); color: var(--primary); font-weight: 700; }
    .error-msg {

      color: #B91C1C;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 8px;
      font-weight: 600;
    }
  </style>
</head>

    function projectCoords(lat, lng, idx) {
      const latNorth = -3.712, latSouth = -3.782, lngWest = -38.545, lngEast = -38.465;
      const latNorm = (latNorth - lat) / (latNorth - latSouth);
      const lngNorm = (lng - lngWest) / (lngEast - lngWest);
      const top = Math.min(80, Math.max(12, Math.round(latNorm * 72 + 10))) + ((idx % 3 - 1) * 2);
      const left = Math.min(84, Math.max(10, Math.round(lngNorm * 76 + 8))) + (((idx + 1) % 3 - 1) * 2);
      return { top: top + '%', left: left + '%' };
    }

    function analisarRelatoIA(relato) {
      const texto = relato.toLowerCase();
      let categoria = 'calcada', estado = 'parcial', gravidade = 'Média';
      let resumo = 'Registro de infraestrutura urbana analisado segundo critérios da NBR 9050.';
      let recomendacao = 'Verificar largura livre mínima de 1,20m e regularidade do piso conforme ABNT NBR 9050.';

      if (texto.includes('rampa') || texto.includes('guia')) {
        categoria = 'rampa';
        if (texto.includes('quebrada') || texto.includes('danificada') || texto.includes('sem rampa') || texto.includes('íngreme') || texto.includes('inclinada')) {
          estado = 'inacessivel'; gravidade = 'Alta';
          resumo = 'Problema crítico em rampa de acesso, inviabilizando circulação segura de cadeirantes.';
          recomendacao = 'Adequar inclinação longitudinal máxima para 8,33% e instalar piso tátil de alerta (NBR 9050).';
        } else {
          estado = 'acessivel'; gravidade = 'Baixa';
          resumo = 'Rampa de acesso em boas condições de uso e inclinação adequada.';
          recomendacao = 'Manter conservação periódica e sinalização tátil/visual no início e término da rampa.';
        }
      } else if (texto.includes('buraco') || texto.includes('obstruíd') || texto.includes('entulho') || texto.includes('poste') || texto.includes('quebrad')) {
        categoria = 'calcada'; estado = 'inacessivel'; gravidade = 'Alta';
        resumo = 'Barreira física ou pavimento danificado na calçada impedindo passagem contínua.';
        recomendacao = 'Desobstruir faixa livre mínima de 1,20m e recompor pavimento regular e antiderrapante.';
      } else if (texto.includes('elevador') || texto.includes('entrada') || texto.includes('degrau')) {
        categoria = 'acesso'; estado = texto.includes('degrau') ? 'inacessivel' : 'acessivel';
        gravidade = texto.includes('degrau') ? 'Alta' : 'Baixa';
        resumo = 'Análise de acesso a edificação para pessoas com mobilidade reduzida.';
        recomendacao = 'Garantir rampa ou plataforma elevatória e vão livre mínimo de 0,80m nas portas.';
      }
      return { resumo, categoriaSugerida: categoria, classificacaoSugerida: estado, gravidade, recomendacao };
    }

    // Handlers
    function handleLogin() {
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const pass = document.getElementById('login-pass').value;
      const found = state.accounts.find(a => a.email.toLowerCase() === email && a.pass === pass);
      if (!found) {
        state.authError = 'E-mail ou senha incorretos. Tente raylsonsoaresdeoliveira@gmail.com / 123456.';
        render();
        return;
      }
      state.authError = '';
      state.user = { ...found };
      render();
    }

    function handleRegister() {
      const nome = document.getElementById('reg-nome').value.trim();
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const tel = document.getElementById('reg-tel').value.trim();
      const pass = document.getElementById('reg-pass').value;
      const pass2 = document.getElementById('reg-pass2').value;
      if (!nome || !email || !pass) { state.authError = 'Preencha nome, e-mail e senha.'; render(); return; }
      if (pass.length < 6) { state.authError = 'A senha deve ter pelo menos 6 caracteres.'; render(); return; }
      if (pass !== pass2) { state.authError = 'A confirmação de senha não confere.'; render(); return; }
      const newAcc = { id: 'usr-' + Date.now(), nome, email, telefone: tel, handle: '@' + nome.toLowerCase().replace(/\s+/g,'_'), pass };
      state.accounts.push(newAcc);
      state.user = newAcc;
      state.authError = '';
      render();
    }

    function switchAuth(flow) { state.authFlow = flow; state.authError = ''; state.recoverySuccess = ''; render(); }
    function handleRecovery() {
      const email = document.getElementById('rec-email').value.trim().toLowerCase();
      const newPass = document.getElementById('rec-pass').value.trim();
      if (!email) { state.authError = 'Informe o e-mail da conta.'; render(); return; }
      if (newPass.length < 6) { state.authError = 'A nova senha deve ter pelo menos 6 caracteres.'; render(); return; }
      const idx = state.accounts.findIndex(a => a.email.toLowerCase() === email);
      if (idx === -1) { state.authError = 'Nenhuma conta encontrada com este e-mail.'; render(); return; }
      state.accounts[idx].pass = newPass;
      state.authError = '';
      state.recoverySuccess = 'Senha redefinida com sucesso! Nova senha: ' + newPass;
      render();
    }
    function handleLogout() { state.user = null; state.activeView = 'tab'; state.currentTab = 'mapa'; render(); }

      if (state.aiModalSuggestion) {

      const f = state.formPonto;

        state.pontos = state.pontos.map(p => p.id === state.editingPoint.id ? { ...p, ...f } : p);

          ...f,
          id: 'ponto-' + Date.now(),
          comentario: f.comentario || 'Cadastro colaborativo de acessibilidade.',
          recursos: [f.categoria === 'rampa' ? 'Rampa Padronizada' : 'Piso Tátil', f.estado === 'acessivel' ? 'Livre de Barreiras' : 'Atenção ao Piso'],
          avaliacoesCount: 1,

          criadoPorId: state.user.id,
          criadoEm: '2026-11-09'

        state.pontos.unshift(novo);

      if (!confirm('Deseja realmente excluir este ponto?')) return;
      state.pontos = state.pontos.filter(p => p.id !== id);
      state.activeView = 'tab';
      render();
    }

    function ratePoint(id) {
      state.pontos = state.pontos.map(p => {
        if (p.id !== id) return p;
        const novoCount = p.avaliacoesCount + 1;
        const novaMedia = Number(((p.nota * p.avaliacoesCount + 5) / novoCount).toFixed(1));
        return { ...p, nota: novaMedia, avaliacoesCount: novoCount };
      });
      render();
    }

    function cycleOrigem() { state.origemIdx = (state.origemIdx + 1) % state.pontos.length; render(); }
    function cycleDestino() { state.destinoIdx = (state.destinoIdx + 1) % state.pontos.length; render(); }

    function toggleChat(open) { state.chatOpen = open; render(); }
    function sendQuickChat(q) {
      state.mensagensChat.push({ remetente: 'usuario', texto: q, horario: 'Agora' });
      state.mensagensChat.push({ remetente: 'ia', texto: responderChatIA(q), horario: 'Agora' });
      render();
    }
    function sendChatInput() {
      const el = document.getElementById('chat-input');
      if (!el || !el.value.trim()) return;
      sendQuickChat(el.value.trim());
    }

    let leafletMap = null;
    let mapCenter = [-3.742, -38.502];
    let mapZoom = 12;

    function initLeafletMapIfNeeded() {
      const container = document.getElementById('real-leaflet-map');
      if (!container || typeof L === 'undefined') return;

      if (leafletMap) {
        try {
          mapCenter = [leafletMap.getCenter().lat, leafletMap.getCenter().lng];
          mapZoom = leafletMap.getZoom();
          leafletMap.remove();
        } catch (e) {}
        leafletMap = null;
      }

      leafletMap = L.map(container, {
        zoomControl: false,
        attributionControl: false,
        dragging: true,
        touchZoom: true,
        scrollWheelZoom: true,
        doubleClickZoom: true
      }).setView(mapCenter, mapZoom);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(leafletMap);

      const filtrados = state.pontos.filter(p => {
        const catOk = state.filtroCategoria === 'todos' || p.categoria === state.filtroCategoria;
        const buscaOk = p.titulo.toLowerCase().includes(state.busca.toLowerCase()) || p.endereco.toLowerCase().includes(state.busca.toLowerCase());
        return catOk && buscaOk;
      });

      const sel = state.pontos.find(x => x.id === state.selectedPointId) || filtrados[0];

      filtrados.forEach(p => {
        const isSel = sel && sel.id === p.id;
        const bg = p.estado === 'acessivel' ? '#00875F' : p.estado === 'parcial' ? '#F59E0B' : '#EF4444';
        const ic = p.estado === 'acessivel' ? '♿' : p.estado === 'parcial' ? '⚠️' : '🚫';
        const size = isSel ? 42 : 36;
        const border = isSel ? '3px solid #0F172A' : '2.5px solid #FFFFFF';

        const icon = L.divIcon({
          className: 'custom-leaflet-marker',
          html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${bg};border:${border};display:flex;align-items:center;justify-content:center;color:#fff;font-size:${isSel ? 18 : 15}px;box-shadow:0 3px 8px rgba(0,0,0,0.35);transition:transform 0.15s;">${ic}</div>`,
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2]
        });

        const marker = L.marker([p.latitude, p.longitude], { icon }).addTo(leafletMap);
        marker.on('click', () => {
          state.selectedPointId = p.id;
          mapCenter = [p.latitude, p.longitude];
          render();
        });
      });

      // Ponto azul central de localização do usuário (idêntico à página 9 do Figma)
      const userBlueDot = L.divIcon({
        className: 'user-blue-dot',
        html: `<div style="width:18px;height:18px;border-radius:50%;background:#3B82F6;border:3px solid #FFFFFF;box-shadow:0 0 0 8px rgba(59,130,246,0.22), 0 2px 5px rgba(0,0,0,0.3);"></div>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });
      L.marker([-3.742, -38.502], { icon: userBlueDot, interactive: false }).addTo(leafletMap);

      setTimeout(() => {
        if (leafletMap) leafletMap.invalidateSize();
      }, 60);
    }

    function zoomMap(delta) {
      if (leafletMap) {
        leafletMap.setZoom(leafletMap.getZoom() + delta);
        mapZoom = leafletMap.getZoom();
      }
    }

    function resetMapCenter() {
      mapCenter = [-3.742, -38.502];
      mapZoom = 12;
      if (leafletMap) {
        leafletMap.setView(mapCenter, mapZoom);
      }
    }

    render();
  </script>
</body>
</html>
